<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your analyses — Truthlens</title>
  <style>
    :root { --accent: #4f7cff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --panel: #fff; }
    * { box-sizing: border-box; }
    body { background: #f8fafc; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; }
    .wrap { margin: 0 auto; max-width: 1080px; padding: 32px 24px 64px; }
    a { color: var(--accent); }
    .top { align-items: center; display: flex; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .brand { align-items: baseline; display: flex; gap: 8px; margin-bottom: 10px; }
    .brand-name { color: #0b3d91; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { color: var(--muted); font-size: 12px; font-weight: 500; }
    h1 { font-size: 26px; margin: 0; }
    .back { font-size: 14px; text-decoration: none; white-space: nowrap; }
    .filters { align-items: end; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 14px 16px; }
    .filters label { color: var(--muted); display: flex; flex-direction: column; font-size: 12px; gap: 4px; }
    .filters input, .filters select { border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13px; padding: 7px 9px; }
    button { background: var(--accent); border: none; border-radius: 8px; color: #fff; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    #status { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }
    table { background: var(--panel); border: 1px solid var(--border); border-collapse: collapse; border-radius: 12px; font-size: 13px; overflow: hidden; width: 100%; }
    th { background: #f1f5f9; color: var(--muted); font-size: 11px; letter-spacing: .05em; padding: 10px 12px; text-align: left; text-transform: uppercase; }
    td { border-top: 1px solid var(--border); padding: 9px 12px; vertical-align: top; }
    .badge { border-radius: 999px; display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; }
    .badge.ai { background: #fee2e2; color: #b91c1c; }
    .badge.clean { background: #dcfce7; color: #15803d; }
    .badge.dubious { background: #fef9c3; color: #a16207; }
    .badge.neutral { background: #e2e8f0; color: var(--muted); }
    .muted { color: var(--muted); }
    .hash { font-family: monospace; font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand"><span class="brand-name">Truthlens</span><span class="brand-sub">by Trutyam</span></div>
        <h1>Your analyses</h1>
      </div>
      <a class="back" href="/">&larr; Back to Truthlens</a>
    </div>

    <div class="filters">
      <label>From <input type="date" id="fromDate" /></label>
      <label>To <input type="date" id="toDate" /></label>
      <label>Type
        <select id="typeFilter">
          <option value="">All</option>
          <option value="ai_detect">AI detection</option>
          <option value="c2pa">C2PA provenance</option>
          <option value="ai_heatmap">AI heatmap</option>
        </select>
      </label>
      <label>Channel
        <select id="channelFilter">
          <option value="">All</option>
          <option value="web_app">Web app</option>
          <option value="extension">Extension</option>
          <option value="mobile">Mobile</option>
        </select>
      </label>
      <button id="applyBtn" type="button">Apply</button>
      <button id="refreshBtn" type="button" class="ghost">Refresh</button>
    </div>

    <p id="status">Loading…</p>
    <table id="table" hidden>
      <thead>
        <tr>
          <th>Time (UTC)</th><th>Type</th><th>Result</th><th>AI&nbsp;prob.</th>
          <th>Backend</th><th>Provenance</th><th>Channel</th><th>Image</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="/app/history.js"></script>
</body>
</html>
